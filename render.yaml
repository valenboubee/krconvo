# Render Blueprint — one-click, FREE deploy of Korean Conversation Lab.
# In Render: New +  ->  Blueprint  ->  pick the krconvo repo  ->  Apply.
#
# This uses Render's free tier: no cost, HTTPS URL that works on any device.
# Trade-offs (both fine for casual use):
#   - The service sleeps after ~15 min idle, so the first hit after a nap takes
#     ~30s to wake.
#   - There is no persistent disk on free, so progress is kept only in temporary
#     storage: it survives while the app is awake, but resets when it sleeps or
#     redeploys. To keep progress permanently, see DEPLOY.md (paid disk, ~$7/mo).
services:
  - type: web
    name: krconvo
    runtime: python
    plan: free
    region: frankfurt          # change to your nearest: oregon, ohio, singapore, etc.
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    autoDeploy: true           # redeploys automatically when you push to GitHub
    envVars:
      - key: KCL_PROGRESS_DIR
        value: /tmp/kcl        # writable temp storage (ephemeral on free tier)
      - key: PYTHON_VERSION
        value: 3.12.6
