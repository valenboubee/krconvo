# Render Blueprint — one-click deploy of Korean Conversation Lab.
# In Render: New +  ->  Blueprint  ->  pick the krconvo repo  ->  Apply.
#
# NOTE ON COST: keeping your progress requires a persistent disk, and disks are
# only available on a paid instance (Starter, ~$7/mo). Render's Free tier has no
# disk and sleeps after ~15 min, so on Free your progress would reset. If you'd
# rather not pay, see DEPLOY.md for a cheaper Fly.io path, or just run it locally.
services:
  - type: web
    name: krconvo
    runtime: python
    plan: starter
    region: frankfurt          # change to your nearest: oregon, ohio, singapore, etc.
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    autoDeploy: true           # redeploys automatically when you push to GitHub
    envVars:
      - key: KCL_PROGRESS_DIR
        value: /var/data       # progress.json lives on the persistent disk below
      - key: PYTHON_VERSION
        value: 3.12.6
    disk:
      name: progress
      mountPath: /var/data
      sizeGB: 1
